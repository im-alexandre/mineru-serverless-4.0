[project]
name = "mineru-serverless-4-0"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.101",
    "botocore>=1.43.101",
    "mineru>=4.0",
    "python-dotenv>=1.2.3",
    "runpod>=1.10.0",
]

[tool.uv]
# /root/.cache/uv and the project's .venv often live on different
# filesystems/mounts inside containers, where hardlinking fails with
# "Operation not permitted". Copying avoids that at a small speed cost.
link-mode = "copy"
